<!doctype html>
<meta charset="utf-8">
<title>book3d probe</title>
<!-- check_book3d.mjs 專用：用 iframe 逐頁載入站內頁面，等進場動畫跑完後讀 getComputedStyle，
     結果以 JSON 寫進 #out，再由 headless Chrome 的 --dump-dom 帶回 node。不是給人看的頁面。 -->
<style>html, body { margin: 0; } iframe { border: 0; width: 100vw; height: 900px; display: block; }</style>
<pre id="out">PENDING</pre>
<script>
(function () {
  var pages = new URLSearchParams(location.search).get('pages').split(',');
  var results = {};
  function measure(doc, win) {
    var g = function (el, pseudo) { return win.getComputedStyle(el, pseudo || null); };
    var all = function (sel, root) { return Array.prototype.slice.call((root || doc).querySelectorAll(sel)); };
    var cards = all('.book-card');
    var walls = all('.shelf-viewport, .book-wall');
    var r = {
      innerWidth: win.innerWidth,
      scrollWidth: doc.documentElement.scrollWidth,
      bodyBg: g(doc.body).backgroundColor,
      cardCount: cards.length,
      cards: cards.slice(0, 16).map(function (c) {
        var s = g(c), b = g(c, '::before'), a = g(c, '::after');
        var first = c.firstElementChild;
        return {
          t: s.transform, ts: s.transformStyle, img: s.backgroundImage, size: s.backgroundSize, bg: s.backgroundColor,
          spineT: b.transform, spineOrigin: b.transformOrigin, spineW: b.width, spineContent: b.content,
          spineLeft: b.left, spinePos: b.position, spineImg: b.backgroundImage,
          creaseContent: a.content, creaseLeft: a.left, creaseW: a.width, creaseImg: a.backgroundImage,
          contentLeft: first ? first.offsetLeft : 0
        };
      }),
      // 書名裡的英文單字（2 字以上）若被拆到兩行，Range 會回傳兩個以上不同高度的矩形
      brokenWords: [],
      // 書牆的書卡（getBoundingClientRect 已含 rotateY 投影）不可超出牆面左右邊界
      outOfWall: [],
      overflow: cards.filter(function (c) { return c.scrollHeight > c.clientHeight + 1; })
        .map(function (c) { return c.textContent.trim().slice(0, 16); }),
      faces: all('.book-face').map(function (f) { return g(f).backgroundColor; }),
      walls: walls.map(function (w) { return g(w).backgroundImage + ' | ' + g(w).backgroundColor; }),
      liShadow: all('.shelf > li:not(.clone), .book-wall > li').slice(0, 8).map(function (li) {
        var a = g(li, '::after');
        return { content: a.content, img: a.backgroundImage };
      }),
      wallText: []
    };
    all('.bc-title').forEach(function (h) {
      Array.prototype.forEach.call(h.childNodes, function (n) {
        if (n.nodeType !== 3) return;
        var re = /[A-Za-z0-9×!?'.\-]{2,}/g, m;
        while ((m = re.exec(n.textContent))) {
          var rg = doc.createRange(); rg.setStart(n, m.index); rg.setEnd(n, m.index + m[0].length);
          var tops = {};
          Array.prototype.forEach.call(rg.getClientRects(), function (q) { if (q.width > 0) tops[Math.round(q.top)] = 1; });
          if (Object.keys(tops).length > 1) r.brokenWords.push(m[0]);
        }
      });
    });
    all('.book-wall').forEach(function (w) {
      var wr = w.getBoundingClientRect();
      all('.book-card', w).forEach(function (c) {
        // getBoundingClientRect 不含偽元素：書脊（::before）若被轉成側面會往左甩出書卡盒子，
        // 用「書脊矩陣 → 書卡矩陣」把書脊兩個水平端點投影回書卡座標，取最左的一點
        var cs = g(c), bs = g(c, '::before'), cr = c.getBoundingClientRect();
        var sl = parseFloat(bs.left) || 0, sw = parseFloat(bs.width) || 0, minX = 0;
        if (bs.content !== 'none') {
          var sm = new win.DOMMatrix(bs.transform === 'none' ? undefined : bs.transform);
          var cm = new win.DOMMatrix(cs.transform === 'none' ? undefined : cs.transform);
          [0, sw].forEach(function (x) {
            var q = cm.transformPoint(sm.transformPoint(new win.DOMPoint(x, 0, 0)));
            minX = Math.min(minX, sl + q.x);
          });
        }
        if (cr.left + minX < wr.left - 0.5 || cr.right > wr.right + 0.5) r.outOfWall.push(c.textContent.trim().slice(0, 12));
      });
    });
    walls.forEach(function (w) {
      all('*', w).forEach(function (el) {
        if (el.closest('.book-card') || el.closest('.dim')) return;
        var own = Array.prototype.some.call(el.childNodes, function (n) { return n.nodeType === 3 && n.textContent.trim(); });
        if (own) r.wallText.push({ text: el.textContent.trim().slice(0, 16), color: g(el).color });
      });
    });
    return r;
  }
  function next(i) {
    if (i >= pages.length) { document.getElementById('out').textContent = JSON.stringify(results); return; }
    var f = document.createElement('iframe');
    f.onload = function () {
      // 進場動畫最長約 .8s + 20 本 × 60ms 延遲，等 4 秒確保量到的是靜止狀態
      // headless 的虛擬時間不推進 CSS 動畫，要主動 finish() 才量得到靜止狀態（無限循環的動畫會拋錯，略過）
      setTimeout(function () {
        try {
          f.contentDocument.getAnimations().forEach(function (a) { try { a.finish(); } catch (e) {} });
          results[pages[i]] = measure(f.contentDocument, f.contentWindow);
        }
        catch (e) { results[pages[i]] = { error: String(e) }; }
        f.remove();
        next(i + 1);
      }, 4000);
    };
    f.src = '../' + pages[i];
    document.body.appendChild(f);
  }
  next(0);
})();
</script>
