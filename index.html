<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>台灣熱門漫畫 Top 10｜每日排行</title>
<meta name="description" content="台灣熱門漫畫每日 Top 10 榜單，每天自動換序，點一本書看章節劇情摘要。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2386b89a'/%3E%3Crect x='9' y='7' width='14' height='18' rx='2' fill='%2319191c'/%3E%3Crect x='9' y='7' width='3' height='18' fill='%23fff' opacity='.55'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="index">
<header class="site-header">
  <a class="brand" href="index.html">台漫榜</a>
  <nav class="site-nav" aria-label="站內分頁">
    <a href="index.html" data-nav="index" aria-current="page">每日熱門</a>
    <a href="library.html" data-nav="library">書庫</a>
    <a href="essentials.html" data-nav="essentials">必讀經典</a>
    <a href="timeless.html" data-nav="timeless">有生之年</a>
    <a href="index.html#globalList" data-nav="global">全球榜</a>
  </nav>
  <form class="site-search" action="library.html" role="search">
    <label class="visually-hidden" for="siteSearch">搜尋漫畫</label>
    <input type="search" name="q" id="siteSearch" placeholder="搜尋書名、作者…" aria-label="搜尋漫畫">
  </form>
  <div class="header-right">
    <span class="date-badge" id="dateBadge">載入中…</span>
  </div>
</header>

<section class="hero">
  <div class="hero-head">
    <h1>今天大家在看什麼漫畫</h1>
    <p class="lede"><span id="heroDate">今日</span> 的順序，每天換一次。點一本書看章節劇情摘要。</p>
  </div>
  <div class="shelf-viewport" id="shelfViewport">
    <ol class="shelf" id="shelf" aria-label="今日漫畫書架"></ol>
  </div>
  <div class="plank" aria-hidden="true"></div>
  <h2 class="picks-title">書庫精選</h2>
  <p class="picks-note">每日從書池挑選，不是排名。</p>
  <div class="shelf-viewport" id="shelfViewport2">
    <ol class="shelf" id="shelf2" aria-label="書庫精選書架"></ol>
  </div>
  <div class="plank" aria-hidden="true"></div>
  <div class="chips" id="genreChips" role="group" aria-label="類型篩選"></div>
</section>

<main>
  <section class="rank-section">
    <h2>華文圈熱門</h2>
    <p class="rank-note" id="rankNote"></p>
    <ol class="rank-list" id="rankList"></ol>
  </section>

  <section class="rank-section global-section">
    <h2>全球熱門</h2>
    <p class="rank-note">AniList 即時 trending 前 10，涵蓋日本、韓國、中國等各地作品，不限本站收錄範圍，因此僅供對照、不提供劇情頁。</p>
    <ol class="global-list" id="globalList"></ol>
  </section>
</main>

<footer class="site-footer" id="footer">
  <p>資料為介紹用途，劇情為摘要文字。本頁為劇情介紹，非漫畫原文，支持正版。</p>
</footer>

<script src="assets/js/ranking.js"></script>
<script src="assets/js/library.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
